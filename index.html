<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NexaHub Notes</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            ✦ NexaHub
        </div>

        <a href="../index.html" class="home-btn">
            🏠 Home
        </a>

    </nav>


    <section class="hero">

        <p>📝 NEXAHUB NOTES</p>

        <h1>My Notes</h1>

        <h2>Write. Save. Remember.</h2>

    </section>


    <section class="notes-section">

        <textarea
            id="notesArea"
            placeholder="✍️ Write your notes here..."
        ></textarea>


        <div class="notes-buttons">

            <button onclick="saveNotes()">
                💾 Save Notes
            </button>

            <button onclick="clearNotes()">
                🗑️ Clear
            </button>

        </div>


        <p id="notesStatus"></p>

    </section>


    <footer>
        © 2026 NexaHub | Notes
    </footer>


    <script src="script.js"></script>

</body>

</html>
